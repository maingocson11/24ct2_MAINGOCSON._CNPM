{% if product.images.all %}<div class="gallery"><img class="gallery-main" src="{{ product.images.first.image.url }}" alt="{{ product.name }}"><div class="gallery-thumbnails">{% for image in product.images.all %}<button type="button" data-image="{{ image.image.url }}" aria-label="Ảnh {{ forloop.counter }}: {{ image.caption }}"><img src="{{ image.image.url }}" alt="{{ image.caption|default:product.name }}"></button>{% endfor %}</div></div>{% else %}{% include 'shop/art.html' %}{% endif %}

<form class="purchase-form" method="post" action="{% url 'product' product.pk %}" data-product="{{ product.pk }}">{% csrf_token %}<p>Màu sắc: <strong>{{ product.color }}</strong></p><div class="section-heading compact"><strong>Chọn kích thước</strong><button class="size-guide-link link" type="button">Hướng dẫn chọn size</button></div><div class="variant-options">{% for variant in product.variants.all %}<label class="{% if not variant.stock %}unavailable{% endif %}"><input type="radio" name="variant" value="{{ variant.pk }}" data-stock="{{ variant.stock }}" data-url="{% url 'add_cart' variant.pk %}" required {% if not variant.stock %}disabled{% endif %}><span>{{ variant.color|default:product.color }} / {{ variant.size }}<small>{{ variant.stock }} còn lại</small></span></label>{% endfor %}</div><div class="quantity-picker"><button type="button" data-step="-1" aria-label="Giảm số lượng">−</button><input type="number" name="quantity" aria-label="Số lượng" value="1" min="1" max="99" required><button type="button" data-step="1" aria-label="Tăng số lượng">+</button></div><div class="purchase-actions"><button type="submit">THÊM VÀO GIỎ</button><button class="secondary" type="submit" name="buy_now" value="1">MUA NGAY →</button></div><div class="size-guide" hidden><strong>Bảng size tham khảo</strong><p>S: 50–60kg · M: 60–70kg · L: 70–80kg · XL: 80–90kg.</p><small>Thông số chỉ là gợi ý; độ vừa phụ thuộc chiều cao và phom sản phẩm.</small></div></form>

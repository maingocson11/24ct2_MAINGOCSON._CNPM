{% load shop_tags %}<article class="product-card"><a href="{% url 'product' product.pk %}">{% include 'shop/art.html' %}</a><div class="card-info"><small>{{ product.category }} · {{ product.color }}</small><h3><a href="{% url 'product' product.pk %}">{{ product.name }}</a></h3><strong>{{ product.price|money }}</strong>{% if product.original_price > product.price %} <del>{{ product.original_price|money }}</del><span class="sale-label">SALE</span>{% endif %}</div><div class="card-actions"><button class="quickview-button secondary" type="button" data-template="quick-{{ product.pk }}">Xem nhanh</button><a class="button" href="{% url 'product' product.pk %}">Chọn size +</a></div><template class="quick-template"><div class="quick-layout">{% include 'shop/art.html' %}<div><p class="eyebrow">{{ product.category }}</p><h2>{{ product.name }}</h2><p class="price">{{ product.price|money }}</p><p>{{ product.description }}</p>{% include 'shop/purchase.html' %}<a class="back" href="{% url 'product' product.pk %}">Xem chi tiết sản phẩm →</a></div></div></template></article>
